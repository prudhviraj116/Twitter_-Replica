<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account - X Replica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="twitter.css">
</head>
<body class="auth-page">
    <article class="auth-card">
        <div class="auth-brand">
            <i class="fab fa-twitter"></i>
            X Replica
        </div>
        <h1>Create your account</h1>
        <p>Join X Replica to connect with people and follow the latest conversations.</p>
        <form id="signup-form" onsubmit="return validateSignup();">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="username" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="password" required>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="confirm password" required>
            <button type="submit">Sign up</button>
            <p class="form-error" id="signup-error">Please fill in all fields correctly.</p>
        </form>
        <p class="form-footer">Already have an account? <a class="form-link" href="xtwitter.html">Sign in</a></p>
    </article>
    <script>
        function validateSignup() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('signup-error');
            if (!username || !email || !password || !confirmPassword || password !== confirmPassword) {
                errorDiv.style.display = 'block';
                return false;
            }
            errorDiv.style.display = 'none';
            // Store user details temporarily
            localStorage.setItem('user', JSON.stringify({username, email, password}));
            window.location.href = 'xtwitter.html';
            return false;
        }
    </script>
</body>
</html>
