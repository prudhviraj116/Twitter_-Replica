<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - X Replica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="twitter.css">
</head>
<body class="auth-page">
    <article class="auth-card">
        <div class="auth-brand">
            <i class="fab fa-twitter"></i>
            X Replica
        </div>
        <h1>Forgot your password?</h1>
        <p>Enter your email, phone, or username and we'll send a link to reset your password.</p>
        <form id="forgot-form" action="password.html" method="post">
            <label for="recovery-input">Email, phone, or username</label>
            <input id="recovery-input" name="recovery" type="text" placeholder="Enter your account details" required>
            <button type="submit">Send reset link</button>
        </form>
        <p class="form-footer">Remembered your password? <a class="form-link" href="xtwitter.html">Sign in</a></p>
    </article>
</body>
</html>
