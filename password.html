<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter your password - X Replica</title>
    <link rel="stylesheet" href="twitter.css">
</head>
<body class="auth-page">
    <article class="auth-card">
        <div class="auth-brand">
            <i class="fab fa-twitter"></i>
            X Replica
        </div>
        <h1>Enter your password</h1>
        <p>Enter the password for your account to continue.</p>
        <form id="password-form" onsubmit="event.preventDefault(); handleLogin();">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="form-footer"><a class="form-link" href="forgot-password.html">Forgot password?</a></p>
        <p class="form-footer"><a class="form-link" href="xtwitter.html">Back to sign in</a></p>
    </article>
    <script>
        function handleLogin() {
            const password = document.getElementById('password').value;
            if (!password) return;
            // For simplicity, just set logged in
            localStorage.setItem('isLoggedIn', 'true');
            const loginInput = localStorage.getItem('loginInput');
            if (loginInput) {
                localStorage.setItem('currentUser', loginInput);
            }
            window.location.href = 'explore.html';
        }
    </script>
</body>
</html>
